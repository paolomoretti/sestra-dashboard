services:
  sestra-dashboard:
    image: littlebrown/sestra-dashboard:latest
    container_name: sestra-dashboard
    restart: unless-stopped
    ports:
      - '8787:80'
    environment:
      - HA_ADDRESS=${HA_ADDRESS}
      - HA_ACCESS_TOKEN=${HA_ACCESS_TOKEN}
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}

  tailscale:
    image: tailscale/tailscale:latest
    container_name: sestra-tailscale
    hostname: sestra-ts
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /config
        cat <<'EJSON' > /config/serve.json
        {"TCP":{"443":{"HTTPS":true}},"Web":{"sestra-dashboard.tail8c24dc.ts.net:443":{"Handlers":{"/":{"Proxy":"http://sestra-dashboard:80"}}}}}
        EJSON
        exec /usr/local/bin/containerboot
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_HOSTNAME=sestra-dashboard
      - TS_USERSPACE=false

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
    restart: unless-stopped

volumes:
  tailscale-state:
